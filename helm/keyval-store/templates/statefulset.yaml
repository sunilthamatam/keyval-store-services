apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "keyval-store.fullname" . }}
  labels:
    {{- include "keyval-store.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "keyval-store.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "keyval-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "keyval-store.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keyval-store.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-dirs
          image: busybox:1.35
          command: ['sh', '-c', 'mkdir -p /data/db /data/snapshots /data/logs && chown -R 1000:1000 /data']
          volumeMounts:
            - name: data
              mountPath: /data/db
              subPath: db
            - name: snapshots
              mountPath: /data/snapshots
              subPath: snapshots
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - java
            - -jar
            - /app/keyval-application.jar
            - server
            - /config/config.yml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_ID
              value: "$(POD_NAME)"
            - name: NODE_NAME
              value: "$(POD_NAME)"
            - name: JAVA_OPTS
              value: "-Xmx{{ .Values.resources.limits.memory }} -Xms{{ .Values.resources.requests.memory }} -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data/db
              subPath: db
            - name: snapshots
              mountPath: /data/snapshots
              subPath: snapshots
            - name: logs
              mountPath: /data/logs
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "keyval-store.fullname" . }}
        - name: logs
          emptyDir: {}
        {{- if not .Values.snapshotPersistence.enabled }}
        - name: snapshots
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
    {{- end }}
    {{- if .Values.snapshotPersistence.enabled }}
    - metadata:
        name: snapshots
        {{- with .Values.snapshotPersistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.snapshotPersistence.accessMode | quote }}
        {{- if .Values.snapshotPersistence.storageClass }}
        storageClassName: {{ .Values.snapshotPersistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.snapshotPersistence.size | quote }}
    {{- end }}
